name: CI

on:
  pull_request:
    paths-ignore:
      - "**.md"
      - ".markdownlint.json"
      - ".gitignore"
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - ".markdownlint.json"
      - ".gitignore"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Test build
            run: nix build .#nixosConfigurations.ci.config.system.build.toplevel -L
            cachix: true
          - name: Flake check
            run: nix flake check
            cachix: true
          - name: statix
            run: nix run nixpkgs#statix -- check .
            cachix: false
          - name: deadnix
            run: nix run nixpkgs#deadnix -- --fail --exclude '**/hardware-configuration.nix' .
            cachix: false
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v25
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: accept-flake-config = true
      - if: matrix.cachix
        uses: cachix/cachix-action@v14
        with:
          name: cherrblyria
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: ${{ matrix.name }}
        run: ${{ matrix.run }}
