name: Check NixOS Config

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
          with:
            determinate: false
      - name: flake check
        run: nix flake check --no-build
        
      - name: build system closure
        run: nix build .#nixosConfigurations.nixos.config.system.build.toplevel -L
