name: Flake Update

on:
  schedule:
    - cron: "0 6 * * 6"
  workflow_dispatch:

concurrency:
  group: flake-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          determinate: false
          extra-conf: |
            accept-flake-config = true
      - uses: cachix/cachix-action@v14
        with:
          name: cherrblyria
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Flake update
        run: nix flake update
      - name: Test build
        id: build
        run: nix build .#nixosConfigurations.nixos.config.system.build.toplevel -L
        continue-on-error: true
      - name: Open PR if build succeeded
        if: steps.build.outcome == 'success'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: flake update"
          title: "Flake update"
          branch: flake-update
          delete-branch: true
          body: Automated `nix flake update` — build passed.
          reviewers: cherrblyria
      - name: Open issue if build failed
        if: steps.build.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'flake-update-failure'
            });
            if (existing.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `flake update broke the build — ${new Date().toISOString().slice(0,10)}`,
                body: `Automated \`nix flake update\` produced a flake.lock that fails to build.\n\nLogs: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                labels: ['flake-update-failure']
              });
            }
